<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Wedding Of Ardy & Ana (3D Cinematic)</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="apple-touch-icon" href="favicon.png?v=2">
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Wedding Of Ardy & Ana" />
    <meta property="og:description" content="Pawiwahan Ardy & Ana - Kamis, 31 Desember 2026, Tabanan, Bali" />
    <meta property="og:image" content="https://ardyputrawan76-sketch.github.io/wedding/bgt-cover.jpg" />
    <meta property="og:image:secure_url" content="https://ardyputrawan76-sketch.github.io/wedding/bgt-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="400" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-glow: #f5e4b8;
            --gold-dark: #8b5a2b;
            --bg-dark: #0d0603;
            --card-glass: rgba(26, 14, 8, 0.95);
            --font-script: 'Great Vibes', cursive;
            --font-body: 'Montserrat', sans-serif;
            --font-title: 'Cinzel Decorative', cursive, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-body);
            color: #fcecd7;
            position: relative;
        }

        /* CANVAS THREE.JS 3D */
        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            display: block;
        }

        /* ORNAMEN SUDUT UKIRAN BALI */
        .corner-ornament {
            position: fixed;
            width: clamp(140px, 28vw, 240px);
            z-index: 6;
            pointer-events: none;
            opacity: 0.75;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
            transition: transform 0.2s ease-out;
        }
        .co-top-left { top: -15px; left: -15px; }
        .co-top-right { top: -15px; right: -15px; transform: scaleX(-1); }

        /* COVER SCREEN PEMBUKA */
        #cover-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background: linear-gradient(rgba(13, 6, 3, 0.75), rgba(13, 6, 3, 0.85)), url('bg-cover.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1), transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #cover-screen.opened {
            opacity: 0;
            transform: scale(1.15);
            pointer-events: none;
        }

        .royal-badge {
            letter-spacing: 4px;
            font-size: 0.75rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            font-weight: 700;
            padding: 4px 14px;
            border-top: 1px solid var(--gold-primary);
            border-bottom: 1px solid var(--gold-primary);
            display: inline-block;
            margin-bottom: 10px;
        }

        .cover-title {
            font-family: var(--font-script);
            font-size: clamp(3.2rem, 11vw, 5.2rem);
            color: var(--gold-glow);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6), 2px 4px 10px rgba(0,0,0,0.9);
            margin: 10px 0 20px 0;
            line-height: 1.1;
        }

        .guest-card {
            background: rgba(43, 24, 13, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 16px 28px;
            margin: 10px auto 25px auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
        }

        .btn-open-3d {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #a36c34, #663e1d);
            color: #ffffff;
            border: 2px solid var(--gold-primary);
            padding: 15px 36px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.45);
            transition: all 0.3s ease;
        }
        .btn-open-3d:active { transform: scale(0.95); }

        /* FLOATING 3D NAVIGATION HEADER (ADAPTIF LANDSCAPE/PORTRAIT) */
        .top-3d-nav {
            position: fixed;
            top: 18px; left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 6px;
            background: rgba(22, 11, 5, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 6px 10px;
            border-radius: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            max-width: 95vw;
            overflow-x: auto;
        }
        .top-3d-nav.active { opacity: 1; pointer-events: auto; }

        .nav-btn-3d {
            background: transparent;
            color: #dfcbaf;
            border: none;
            padding: 7px 14px;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .nav-btn-3d.active, .nav-btn-3d:hover {
            background: linear-gradient(135deg, var(--gold-dark), #5c3514);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* 3D FLOATING HUD PANELS */
        #hud-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .hud-station {
            position: absolute;
            width: 92%;
            max-width: 540px;
            max-height: 72vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            border-radius: 24px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(212,175,55,0.3);
            opacity: 0;
            transform: scale(0.85) translateZ(-80px);
            pointer-events: none;
            transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .hud-station::-webkit-scrollbar { width: 4px; }
        .hud-station::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 4px; }

        .hud-station.active {
            opacity: 1;
            transform: scale(1) translateZ(0);
            pointer-events: auto;
        }

        /* KHUSUS TAMPILAN LANDSCAPE / LAYAR LEBAR */
        @media screen and (orientation: landscape) {
            .hud-station {
                max-width: 620px;
                max-height: 78vh;
                padding: 25px 30px;
            }
            .top-3d-nav {
                top: 12px;
                padding: 4px 12px;
            }
        }

        .hud-station.card-mahya-style {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 68vh;
            min-height: 400px;
            background: url('bg-cover.png') no-repeat center center/cover;
            position: relative;
            border-radius: 24px;
        }

        .mahya-overlay-bottom {
            background: linear-gradient(to top, rgba(10, 5, 2, 0.92) 0%, rgba(10, 5, 2, 0.65) 70%, rgba(10, 5, 2, 0) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            padding: 16px 18px 20px 18px;
            text-align: center;
            width: 100%;
        }

        .salam-arab-small { 
            font-family: var(--font-script); 
            font-size: 2rem; 
            color: var(--gold-glow); 
            margin-bottom: 2px; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); 
        }
        .salam-teks-small { 
            font-size: 0.78rem; 
            color: #fcecd7; 
            line-height: 1.5; 
            text-shadow: 0 1px 4px rgba(0,0,0,0.9); 
            font-weight: 400;
        }

        .section-title { font-family: var(--font-script); font-size: 2.5rem; color: var(--gold-glow); margin-bottom: 12px; }
        .pembatas { border: 0; height: 1px; background: linear-gradient(to right, transparent, var(--gold-primary), transparent); margin: 24px 0; }

        /* MEMPELAI PROFILES */
        .mempelai-grid { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 15px; }
        .mempelai-profile {
            width: 100%; max-width: 320px; background: rgba(43, 24, 13, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 18px; padding: 20px;
        }
        .avatar-circle {
            width: 140px; height: 140px; margin: 0 auto 12px;
            border-radius: 50%; overflow: hidden;
            border: 3px solid var(--gold-primary); box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            background: #2b170c; cursor: pointer;
        }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .nama-mempelai { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .ortu-info { font-size: 0.8rem; color: #cbb9a7; line-height: 1.5; }

        /* TIMER */
        .timer-flex { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .timer-unit {
            background: rgba(43, 24, 13, 0.85); width: 66px; padding: 12px 4px;
            border-radius: 12px; border: 1px solid var(--gold-primary);
        }
        .timer-unit span { font-size: 1.4rem; font-weight: 700; color: var(--gold-glow); display: block; }
        .timer-unit p { font-size: 0.7rem; color: #cbbba9; margin-top: 2px; }

        .btn-maps-action {
            display: inline-flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, #1d976c, #25d366); color: #fff;
            text-decoration: none; padding: 12px 28px; border-radius: 30px;
            font-size: 0.88rem; font-weight: 700; margin-top: 15px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
        }

        /* GALERI SLIDER */
        .gallery-container { position: relative; margin-top: 15px; display: flex; align-items: center; }
        .gallery-track {
            display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
            scroll-behavior: smooth; padding: 10px 2px;
        }
        .gallery-track::-webkit-scrollbar { display: none; }
        .gallery-card {
            flex: 0 0 85%; scroll-snap-align: center; height: 260px;
            border-radius: 14px; overflow: hidden; border: 2px solid rgba(212, 175, 55, 0.5);
            cursor: pointer; background: #24130a;
        }
        .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(139, 90, 43, 0.95); color: #fff; border: 1px solid var(--gold-primary);
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10;
        }
        .g-btn-left { left: -8px; }
        .g-btn-right { right: -8px; }

        /* ATM BPD BALI */
        .atm-bpd-wrapper {
            background: linear-gradient(135deg, #053b23 0%, #075c35 50%, #0c7a47 100%);
            color: white; padding: 18px; border-radius: 16px;
            max-width: 320px; margin: 18px auto; text-align: left;
            border: 1px solid rgba(212, 175, 55, 0.5); box-shadow: 0 10px 30px rgba(5, 68, 41, 0.5);
        }
        .teks-timbul-atm {
            color: #ebd197 !important; font-family: 'Courier New', monospace; font-weight: bold;
            text-shadow: -1px -1px 0px rgba(0, 0, 0, 0.9), 1px 1px 1px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px !important;
        }

        /* RSVP FORM */
        .rsvp-form-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; text-align: left; }
        .rsvp-form-group input, .rsvp-form-group select, .rsvp-form-group textarea {
            width: 100%; padding: 12px; border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px; font-family: inherit; font-size: 0.9rem;
            background-color: rgba(18, 9, 4, 0.85); color: #fff;
        }
        .btn-kirim-rsvp {
            background: linear-gradient(135deg, var(--gold-dark), #5c3514);
            color: #fff; border: 1px solid var(--gold-primary);
            width: 100%; padding: 12px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
        }

        /* WADAH RIWAYAT KOMENTAR */
        .riwayat-container {
            margin-top: 16px;
            background: rgba(18, 9, 4, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 14px;
            padding: 12px;
            text-align: left;
            max-height: 160px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .riwayat-container::-webkit-scrollbar { width: 4px; }
        .riwayat-container::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 4px; }

        .riwayat-item {
            background: rgba(43, 24, 13, 0.85);
            border-left: 3px solid var(--gold-primary);
